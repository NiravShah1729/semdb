services:
  embedding-service:
    build: ./embedding-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-clone:
    build: .
    ports:
      - "6380:6380"
    environment:
      - EMBEDDING_SERVICE_URL=http://embedding-service:8000
    depends_on:
      embedding-service:
        condition: service_healthy
    volumes:
      - redis-data:/app/data

volumes:
  redis-data: